<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medusas</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 4rem);
        margin: 0 0 0.5rem;
      }
      p {
        opacity: 0.7;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Medusas</h1>
      <p>Hello, world.</p>
    </main>
  </body>
</html>
