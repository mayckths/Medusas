<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medusas — Notes</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf7;
        --surface: #ffffff;
        --surface-alt: #f3f3ee;
        --border: #e3e3dc;
        --text: #1a1a1a;
        --text-dim: #6a6a64;
        --accent: #2f6fde;
        --accent-hover: #265bbb;
        --danger: #c0392b;
        --radius: 10px;
        --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a;
          --surface: #1f1f24;
          --surface-alt: #26262c;
          --border: #2e2e36;
          --text: #f0f0ec;
          --text-dim: #8b8b88;
          --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-size: 15px;
        line-height: 1.45;
      }
      .container { max-width: 980px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
      header.app {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap;
      }
      header.app h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
      header.app .sub { color: var(--text-dim); font-size: 0.85rem; }
      .view-toggle {
        display: inline-flex; background: var(--surface-alt); border-radius: 999px; padding: 3px;
        border: 1px solid var(--border);
      }
      .view-toggle button {
        background: transparent; border: 0; padding: 0.35rem 0.9rem; cursor: pointer;
        color: var(--text-dim); border-radius: 999px; font-size: 0.85rem;
      }
      .view-toggle button.active {
        background: var(--surface); color: var(--text); box-shadow: var(--shadow);
      }

      .editor {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 1rem; margin-bottom: 2rem; box-shadow: var(--shadow);
      }
      .editor input.title {
        width: 100%; border: 0; background: transparent; color: var(--text);
        font-size: 1.15rem; font-weight: 600; padding: 0.25rem 0 0.5rem; outline: none;
      }
      .editor input.title::placeholder { color: var(--text-dim); }
      .toolbar {
        display: flex; gap: 0.25rem; flex-wrap: wrap; align-items: center;
        padding: 0.35rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
        margin-bottom: 0.5rem;
      }
      .toolbar button {
        background: transparent; border: 0; color: var(--text-dim); cursor: pointer;
        padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 0.85rem;
      }
      .toolbar button:hover { background: var(--surface-alt); color: var(--text); }
      .toolbar .divider { width: 1px; background: var(--border); align-self: stretch; margin: 0 0.25rem; }
      .toolbar label.toggle {
        margin-left: auto; display: inline-flex; align-items: center; gap: 0.35rem;
        font-size: 0.8rem; color: var(--text-dim); cursor: pointer;
      }
      .content-area {
        min-height: 90px; padding: 0.5rem 0; outline: none;
        font-size: 0.95rem; color: var(--text);
      }
      .content-area:empty:before {
        content: attr(data-placeholder); color: var(--text-dim); pointer-events: none;
      }
      .content-area a { color: var(--accent); }
      textarea.content-plain {
        width: 100%; min-height: 90px; resize: vertical;
        border: 0; background: transparent; color: var(--text);
        font-family: inherit; font-size: 0.95rem; padding: 0.5rem 0; outline: none;
      }

      .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
      .chip {
        display: inline-flex; align-items: center; gap: 0.35rem;
        background: var(--surface-alt); border: 1px solid var(--border); border-radius: 999px;
        padding: 0.2rem 0.6rem; font-size: 0.8rem; color: var(--text-dim);
      }
      .chip a { color: var(--accent); text-decoration: none; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chip button { background: transparent; border: 0; color: var(--text-dim); cursor: pointer; font-size: 0.9rem; padding: 0 0.1rem; }
      .chip button:hover { color: var(--danger); }
      .images-preview { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0; }
      .images-preview .thumb {
        position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden;
        border: 1px solid var(--border); background: var(--surface-alt);
      }
      .images-preview .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .images-preview .thumb button.remove {
        position: absolute; top: 2px; right: 2px;
        background: rgba(0,0,0,0.6); color: white; border: 0; border-radius: 999px;
        width: 20px; height: 20px; font-size: 0.7rem; cursor: pointer; line-height: 1;
      }

      .editor-actions {
        display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem;
        padding-top: 0.5rem; border-top: 1px solid var(--border);
      }
      .editor-actions .left { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
      .editor-actions .right { margin-left: auto; display: flex; gap: 0.5rem; }
      button.btn {
        border: 1px solid var(--border); background: var(--surface-alt); color: var(--text);
        padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
      }
      button.btn:hover { background: var(--border); }
      button.btn.primary { background: var(--accent); color: white; border-color: transparent; }
      button.btn.primary:hover { background: var(--accent-hover); }
      button.btn.ghost { background: transparent; }
      button.btn.danger { color: var(--danger); border-color: transparent; background: transparent; }

      .status { font-size: 0.8rem; color: var(--text-dim); }
      .status.error { color: var(--danger); }

      /* Notes display */
      .notes[data-view="cards"] {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.85rem;
      }
      .notes[data-view="list"] { display: flex; flex-direction: column; gap: 0.6rem; }
      .note {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 0.9rem 1rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 0.5rem;
      }
      .notes[data-view="list"] .note { flex-direction: row; align-items: flex-start; gap: 1rem; }
      .notes[data-view="list"] .note .body { flex: 1; }
      .note h3 { margin: 0; font-size: 1.02rem; letter-spacing: -0.01em; }
      .note .preview {
        color: var(--text-dim); font-size: 0.88rem;
        display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .notes[data-view="list"] .note .preview { -webkit-line-clamp: 2; }
      .note .preview a { color: var(--accent); }
      .note .meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-dim); }
      .note .gallery { display: flex; gap: 0.3rem; flex-wrap: wrap; }
      .note .gallery img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
      .note .links { display: flex; gap: 0.35rem; flex-wrap: wrap; }
      .note .links a {
        font-size: 0.75rem; color: var(--accent); text-decoration: none;
        background: var(--surface-alt); padding: 0.15rem 0.5rem; border-radius: 999px;
        border: 1px solid var(--border); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .note .actions { display: flex; gap: 0.25rem; }
      .note .actions button {
        background: transparent; border: 0; color: var(--text-dim); cursor: pointer;
        font-size: 0.78rem; padding: 0.2rem 0.4rem; border-radius: 5px;
      }
      .note .actions button:hover { background: var(--surface-alt); color: var(--text); }
      .note .actions button.del:hover { color: var(--danger); }

      .empty {
        text-align: center; color: var(--text-dim); padding: 3rem 1rem;
        border: 1px dashed var(--border); border-radius: var(--radius);
      }

      .footer { margin-top: 3rem; color: var(--text-dim); font-size: 0.75rem; text-align: center; }
      .footer code { background: var(--surface-alt); padding: 0.1rem 0.35rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="app">
        <div>
          <h1>Medusas</h1>
          <div class="sub">Personal notes — text, images, links</div>
        </div>
        <div class="view-toggle" role="tablist" aria-label="View mode">
          <button id="view-cards" class="active" aria-pressed="true">Cards</button>
          <button id="view-list" aria-pressed="false">List</button>
        </div>
      </header>

      <section class="editor" id="editor">
        <input type="text" class="title" id="title" placeholder="Title…" maxlength="200" />

        <div class="toolbar" id="toolbar">
          <button type="button" data-cmd="bold" title="Bold (⌘B)"><b>B</b></button>
          <button type="button" data-cmd="italic" title="Italic (⌘I)"><i>I</i></button>
          <button type="button" data-cmd="insertUnorderedList" title="Bulleted list">•</button>
          <button type="button" data-cmd="insertOrderedList" title="Numbered list">1.</button>
          <button type="button" data-cmd="createLink" title="Insert link">🔗</button>
          <div class="divider"></div>
          <label class="toggle">
            <input type="checkbox" id="rich-toggle" />
            Rich text
          </label>
        </div>

        <div class="content-area" id="content-rich" contenteditable="true" data-placeholder="Write something…" hidden></div>
        <textarea class="content-plain" id="content-plain" placeholder="Write something…"></textarea>

        <div class="chips" id="links-chips"></div>
        <div class="images-preview" id="images-preview"></div>

        <div class="editor-actions">
          <div class="left">
            <button class="btn" type="button" id="add-link-btn">+ Link</button>
            <button class="btn" type="button" id="add-image-btn">+ Image</button>
            <input type="file" id="image-input" accept="image/*" multiple hidden />
            <span class="status" id="status"></span>
          </div>
          <div class="right">
            <button class="btn ghost" type="button" id="cancel-btn" hidden>Cancel</button>
            <button class="btn primary" type="button" id="save-btn">Save note</button>
          </div>
        </div>
      </section>

      <section class="notes" id="notes" data-view="cards"></section>

      <p class="footer">
        Backed by Supabase · <code>notes</code> table · <code>notes-images</code> bucket
      </p>
    </div>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

      const SUPABASE_URL = 'https://vmdsibzivcugjidtkhzt.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_ndJSJcAcexIbz9yn1zRoLw_iyeerQXy';
      const BUCKET = 'notes-images';

      const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

      // ---------- State ----------
      const state = {
        view: 'cards',
        editingId: null,
        notes: [],
        // Draft state mirrors the editor:
        draft: { title: '', content: '', isRich: false, links: [], images: [] },
      };

      // ---------- DOM ----------
      const $ = (sel) => document.querySelector(sel);
      const titleEl = $('#title');
      const richEl = $('#content-rich');
      const plainEl = $('#content-plain');
      const richToggle = $('#rich-toggle');
      const toolbar = $('#toolbar');
      const linksChips = $('#links-chips');
      const imagesPreview = $('#images-preview');
      const imageInput = $('#image-input');
      const statusEl = $('#status');
      const saveBtn = $('#save-btn');
      const cancelBtn = $('#cancel-btn');
      const notesEl = $('#notes');

      // ---------- Helpers ----------
      function setStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.classList.toggle('error', isError);
        if (msg && !isError) setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = ''; }, 2500);
      }

      function publicImageUrl(path) {
        return supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
      }

      function fmtDate(iso) {
        const d = new Date(iso);
        const now = new Date();
        const sameDay = d.toDateString() === now.toDateString();
        return sameDay
          ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
          : d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      }

      // ---------- Editor ----------
      function setRichMode(isRich) {
        state.draft.isRich = isRich;
        richToggle.checked = isRich;
        if (isRich) {
          // copy plain text into rich
          if (richEl.innerHTML.trim() === '' && plainEl.value.trim() !== '') {
            richEl.innerText = plainEl.value;
          }
          richEl.hidden = false;
          plainEl.hidden = true;
        } else {
          // copy rich text (as plain) into plain
          if (plainEl.value.trim() === '' && richEl.innerText.trim() !== '') {
            plainEl.value = richEl.innerText;
          }
          richEl.hidden = true;
          plainEl.hidden = false;
        }
      }

      function readEditor() {
        const title = titleEl.value.trim();
        const content = state.draft.isRich ? richEl.innerHTML : plainEl.value;
        return {
          title,
          content,
          content_is_rich: state.draft.isRich,
          links: state.draft.links,
          images: state.draft.images,
        };
      }

      function clearEditor() {
        titleEl.value = '';
        richEl.innerHTML = '';
        plainEl.value = '';
        state.draft = { title: '', content: '', isRich: false, links: [], images: [] };
        setRichMode(false);
        renderChips();
        renderImagesPreview();
        state.editingId = null;
        cancelBtn.hidden = true;
        saveBtn.textContent = 'Save note';
      }

      function loadIntoEditor(note) {
        state.editingId = note.id;
        titleEl.value = note.title;
        state.draft.isRich = !!note.content_is_rich;
        setRichMode(state.draft.isRich);
        if (state.draft.isRich) {
          richEl.innerHTML = note.content || '';
        } else {
          plainEl.value = note.content || '';
        }
        state.draft.links = Array.isArray(note.links) ? [...note.links] : [];
        state.draft.images = Array.isArray(note.images) ? [...note.images] : [];
        renderChips();
        renderImagesPreview();
        cancelBtn.hidden = false;
        saveBtn.textContent = 'Update note';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        titleEl.focus();
      }

      function renderChips() {
        linksChips.innerHTML = '';
        for (const [i, link] of state.draft.links.entries()) {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.innerHTML = `🔗 <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.label || link.url)}</a> <button type="button" aria-label="Remove">×</button>`;
          chip.querySelector('button').addEventListener('click', () => {
            state.draft.links.splice(i, 1);
            renderChips();
          });
          linksChips.appendChild(chip);
        }
      }

      function renderImagesPreview() {
        imagesPreview.innerHTML = '';
        for (const [i, path] of state.draft.images.entries()) {
          const thumb = document.createElement('div');
          thumb.className = 'thumb';
          thumb.innerHTML = `<img src="${escapeHtml(publicImageUrl(path))}" alt="" /><button class="remove" type="button" aria-label="Remove">×</button>`;
          thumb.querySelector('button.remove').addEventListener('click', async () => {
            // Best-effort: remove file from storage; remove from draft regardless
            try { await supabase.storage.from(BUCKET).remove([path]); } catch {}
            state.draft.images.splice(i, 1);
            renderImagesPreview();
          });
          imagesPreview.appendChild(thumb);
        }
      }

      // ---------- Toolbar ----------
      toolbar.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-cmd]');
        if (!btn) return;
        if (!state.draft.isRich) {
          setRichMode(true);
        }
        richEl.focus();
        const cmd = btn.dataset.cmd;
        if (cmd === 'createLink') {
          const url = prompt('Link URL:');
          if (url) document.execCommand('createLink', false, url);
        } else {
          document.execCommand(cmd, false, null);
        }
      });

      richToggle.addEventListener('change', () => setRichMode(richToggle.checked));

      // ---------- Links / Images ----------
      $('#add-link-btn').addEventListener('click', () => {
        const url = prompt('Link URL:');
        if (!url) return;
        let normalized = url.trim();
        if (!/^https?:\/\//i.test(normalized)) normalized = 'https://' + normalized;
        const label = prompt('Label (optional):', '') || '';
        state.draft.links.push({ url: normalized, label });
        renderChips();
      });

      $('#add-image-btn').addEventListener('click', () => imageInput.click());

      imageInput.addEventListener('change', async () => {
        const files = Array.from(imageInput.files || []);
        imageInput.value = '';
        if (!files.length) return;
        setStatus('Uploading…');
        try {
          for (const file of files) {
            const ext = (file.name.split('.').pop() || 'png').toLowerCase();
            const path = `${crypto.randomUUID()}.${ext}`;
            const { error } = await supabase.storage.from(BUCKET).upload(path, file, {
              cacheControl: '3600', upsert: false, contentType: file.type,
            });
            if (error) throw error;
            state.draft.images.push(path);
          }
          renderImagesPreview();
          setStatus('Uploaded');
        } catch (e) {
          console.error(e);
          setStatus(`Upload failed: ${e.message || e}`, true);
        }
      });

      // ---------- Save / Cancel ----------
      saveBtn.addEventListener('click', async () => {
        const draft = readEditor();
        if (!draft.title) {
          setStatus('Title is required', true);
          titleEl.focus();
          return;
        }
        setStatus('Saving…');
        try {
          if (state.editingId) {
            const { error } = await supabase
              .from('notes')
              .update(draft)
              .eq('id', state.editingId);
            if (error) throw error;
          } else {
            const { error } = await supabase.from('notes').insert(draft);
            if (error) throw error;
          }
          clearEditor();
          await loadNotes();
          setStatus('Saved');
        } catch (e) {
          console.error(e);
          setStatus(`Save failed: ${e.message || e}`, true);
        }
      });

      cancelBtn.addEventListener('click', () => clearEditor());

      // ---------- View toggle ----------
      function setView(view) {
        state.view = view;
        notesEl.dataset.view = view;
        $('#view-cards').classList.toggle('active', view === 'cards');
        $('#view-list').classList.toggle('active', view === 'list');
        $('#view-cards').setAttribute('aria-pressed', view === 'cards');
        $('#view-list').setAttribute('aria-pressed', view === 'list');
      }
      $('#view-cards').addEventListener('click', () => setView('cards'));
      $('#view-list').addEventListener('click', () => setView('list'));

      // ---------- Notes list ----------
      async function loadNotes() {
        const { data, error } = await supabase
          .from('notes')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) {
          setStatus(`Load failed: ${error.message}`, true);
          return;
        }
        state.notes = data || [];
        renderNotes();
      }

      function renderNotes() {
        notesEl.innerHTML = '';
        if (state.notes.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No notes yet — write your first one above.';
          notesEl.appendChild(empty);
          return;
        }
        for (const note of state.notes) {
          notesEl.appendChild(renderNoteCard(note));
        }
      }

      function renderNoteCard(note) {
        const card = document.createElement('article');
        card.className = 'note';

        const body = document.createElement('div');
        body.className = 'body';

        const h = document.createElement('h3');
        h.textContent = note.title;
        body.appendChild(h);

        if (note.content) {
          const p = document.createElement('div');
          p.className = 'preview';
          if (note.content_is_rich) p.innerHTML = note.content;
          else p.textContent = note.content;
          body.appendChild(p);
        }

        if (Array.isArray(note.images) && note.images.length) {
          const gallery = document.createElement('div');
          gallery.className = 'gallery';
          for (const path of note.images) {
            const img = document.createElement('img');
            img.src = publicImageUrl(path);
            img.alt = '';
            img.loading = 'lazy';
            gallery.appendChild(img);
          }
          body.appendChild(gallery);
        }

        if (Array.isArray(note.links) && note.links.length) {
          const lk = document.createElement('div');
          lk.className = 'links';
          for (const link of note.links) {
            const a = document.createElement('a');
            a.href = link.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = link.label || link.url;
            lk.appendChild(a);
          }
          body.appendChild(lk);
        }

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerHTML = `<span>${fmtDate(note.updated_at || note.created_at)}</span>`;
        const actions = document.createElement('div');
        actions.className = 'actions';
        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => loadIntoEditor(note));
        const delBtn = document.createElement('button');
        delBtn.className = 'del';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', () => deleteNote(note));
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        meta.appendChild(actions);
        body.appendChild(meta);

        card.appendChild(body);
        return card;
      }

      async function deleteNote(note) {
        if (!confirm(`Delete "${note.title}"? This cannot be undone.`)) return;
        setStatus('Deleting…');
        try {
          if (Array.isArray(note.images) && note.images.length) {
            try { await supabase.storage.from(BUCKET).remove(note.images); } catch {}
          }
          const { error } = await supabase.from('notes').delete().eq('id', note.id);
          if (error) throw error;
          if (state.editingId === note.id) clearEditor();
          await loadNotes();
          setStatus('Deleted');
        } catch (e) {
          setStatus(`Delete failed: ${e.message || e}`, true);
        }
      }

      // ---------- Boot ----------
      setRichMode(false);
      loadNotes();
    </script>
  </body>
</html>
